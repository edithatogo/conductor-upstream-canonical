on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.BOT_RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create TAR archive
        if: ${{ steps.release.outputs.release_created }}
        run: |
          tar -czvf ../conductor-release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='release-please-config.json' \
            --exclude='.release-please-manifest.json' \
            --exclude='.gitignore' \
            --exclude='CONTRIBUTING.md' \
            .
          mv ../conductor-release.tar.gz .

      - name: Upload archive to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            ${{ steps.release.outputs.tag_name }} \
            conductor-release.tar.gz
